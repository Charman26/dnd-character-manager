<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- narrower than the 320px layout minimum: lay out at 320px and let the browser scale the page down to fit -->
  <script>if (screen.width < 320) document.querySelector('meta[name=viewport]').content = 'width=320, viewport-fit=cover';</script>
  <title>D&amp;D Character Manager</title>
  <meta name="description" content="Offline D&D 5e (2014) character manager">
  <!-- keep the site out of search results (GitHub Pages can't send an X-Robots-Tag header, and a project site can't own /robots.txt) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7e2513">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button data-act="home" class="back" hidden>‹ Characters</button>
    <h1 id="title">D&amp;D 5e Characters</h1>
    <button data-act="lookup" aria-label="Look up rules" title="Look up rules ( / )">🔍</button>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <div id="dice" class="dicebar"></div>
  <dialog id="dlg"><form method="dialog" class="x"><button aria-label="Close">✕</button></form><div id="dlgBody" class="dlgin"></div></dialog>
  <dialog id="info"><form method="dialog" class="x"><button aria-label="Close">✕</button></form><div id="infoBody" class="dlgin"></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
